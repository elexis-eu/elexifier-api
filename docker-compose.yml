version: '3.1'
services:
    nginx:
        build:
            context: ./
            dockerfile: Dockerfile-nginx
        image: elexifier-nginx
        container_name: nginx
        depends_on:
            - flask
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf
        networks:
            - my-network
        ports:
            - 8001:8001
    flask:
        build:
            context: ./
            dockerfile: Dockerfile
        image:  elexifier-flask
        container_name: flask
        volumes:
            - ./app:/var/www/elexifier-api/app
        networks:
            my-network:
                aliases:
                    - flask-app
        ports:
            - 8080:8080

networks:
    my-network:




