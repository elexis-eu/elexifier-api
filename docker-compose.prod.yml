version: '3.1'
services:
  flask:
    build:
      context: ./
      dockerfile: Dockerfile
    command: bash /var/www/elexifier-api/start.sh
    volumes:
      - /home/jgradisar/elexifier_data/media:/var/www/elexifier-api/app/media
    networks:
      elexifier-network:
          aliases:
              - flask-app
    ports:
      - 5000:8080
    depends_on:
      - db
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: elexifier
      POSTGRES_PASSWORD: elexifierpass
      POSTGRES_DB: postgresdb
    networks:
      elexifier-network:
          aliases:
              - db
    ports:
      - 5431:5432

networks:
    elexifier-network:



