version: '3.1'
services:
  flask:
    build:
      context: ./
      dockerfile: Dockerfile
    command: bash /var/www/elexifier-api/start.sh
    networks:
      elexifier-network:
          aliases:
              - flask-app
    ports:
      - 5000:8080
    environment:
      FLASK_ENV: development

networks:
    elexifier-network: