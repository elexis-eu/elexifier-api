version: '3.1'
services:
  flask:
    build:
      context: ./
      dockerfile: Dockerfile
    command: bash /var/www/elexifier-api/start.sh
    volumes:
      - /var/elexifier_data/media:./app/media
    networks:
      elexifier-network:
          aliases:
              - flask-app
    ports:
      - 8080:8080

networks:
    elexifier-network: